
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mon profil - FiniTask</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Barre de navigation -->
    <nav class="navbar bg-white shadow-sm">
        <div class="container">
            <span class="navbar-brand text-primary fw-bold">
                FiniTask
            </span>

            <button id="logoutButton"
                    class="btn btn-outline-danger"
                    disabled>
                Se déconnecter
            </button>
        </div>
    </nav>

    <main class="container py-5">

        <div class="card shadow-sm mx-auto"
             style="max-width: 650px;">

            <div class="card-body p-4">

                <h2 class="text-center text-primary mb-4">
                    Mon profil
                </h2>

                <!-- Messages -->
                <div id="message"
                     class="alert d-none"
                     role="alert"></div>

                <!-- Affichage du profil -->
                <div id="profil" class="d-none">

                    <p>
                        <strong>Nom :</strong>
                        <span id="nom"></span>
                    </p>

                    <p>
                        <strong>Prénom :</strong>
                        <span id="prenom"></span>
                    </p>

                    <p>
                        <strong>Adresse e-mail :</strong>
                        <span id="email"></span>
                    </p>

                    <p>
                        <strong>Rôle :</strong>
                        <span id="role"
                              class="badge text-bg-primary"></span>
                    </p>

                    <button id="editButton"
                            class="btn btn-primary mt-3">
                        Modifier mon profil
                    </button>

                </div>

                <!-- Formulaire de modification -->
                <form id="editForm" class="d-none">

                    <div class="mb-3">
                        <label for="editNom" class="form-label">
                            Nom
                        </label>
                        <input type="text"
                               id="editNom"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="editPrenom" class="form-label">
                            Prénom
                        </label>
                        <input type="text"
                               id="editPrenom"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="editEmail" class="form-label">
                            Adresse e-mail
                        </label>
                        <input type="email"
                               id="editEmail"
                               class="form-control"
                               required>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit"
                                id="saveButton"
                                class="btn btn-success">
                            Enregistrer les modifications
                        </button>

                        <button type="button"
                                id="cancelButton"
                                class="btn btn-secondary">
                            Annuler
                        </button>
                    </div>

                </form>

                <p id="chargement"
                   class="text-center text-muted">
                    Chargement de votre profil...
                </p>

            </div>
        </div>

    </main>

    <script>
        const profil = document.getElementById("profil");
        const editForm = document.getElementById("editForm");
        const message = document.getElementById("message");
        const chargement = document.getElementById("chargement");

        const editButton = document.getElementById("editButton");
        const saveButton = document.getElementById("saveButton");
        const cancelButton = document.getElementById("cancelButton");
        const logoutButton = document.getElementById("logoutButton");

        let utilisateurConnecte = null;
        let csrfToken = null;
        let csrfHeader = null;

        function afficherMessage(texte, type) {
            message.textContent = texte;
            message.className = "alert alert-" + type;
        }

        function afficherProfil(utilisateur) {
            utilisateurConnecte = utilisateur;

            document.getElementById("nom").textContent =
                utilisateur.nom;

            document.getElementById("prenom").textContent =
                utilisateur.prenom;

            document.getElementById("email").textContent =
                utilisateur.email;

            document.getElementById("role").textContent =
                utilisateur.role;

            profil.classList.remove("d-none");
            editForm.classList.add("d-none");
        }

        // Charger les informations de l'utilisateur connecté
        async function chargerProfil() {
            try {
                const response = await fetch("/api/auth/me", {
                    credentials: "same-origin"
                });

                if (response.redirected ||
                    response.status === 401) {
                    window.location.replace("/login.html");
                    return;
                }

                if (!response.ok) {
                    throw new Error(
                        "Impossible de charger votre profil."
                    );
                }

                const utilisateur = await response.json();
                afficherProfil(utilisateur);

            } catch (error) {
                afficherMessage(error.message, "danger");

            } finally {
                chargement.classList.add("d-none");
            }
        }

        // Charger le jeton CSRF
        async function chargerCsrf() {
            try {
                const response = await fetch("/api/csrf", {
                    credentials: "same-origin"
                });

                if (!response.ok) {
                    throw new Error("Jeton CSRF indisponible");
                }

                const data = await response.json();

                csrfToken = data.token;
                csrfHeader = data.headerName;

                logoutButton.disabled = false;

            } catch (error) {
                console.error(error);
                afficherMessage(
                    "Impossible de préparer les actions sécurisées.",
                    "danger"
                );
            }
        }

        // Afficher le formulaire de modification
        editButton.addEventListener("click", () => {

            if (!csrfToken) {
                afficherMessage(
                    "Veuillez patienter : sécurité en cours de chargement.",
                    "warning"
                );
                return;
            }

            document.getElementById("editNom").value =
                utilisateurConnecte.nom;

            document.getElementById("editPrenom").value =
                utilisateurConnecte.prenom;

            document.getElementById("editEmail").value =
                utilisateurConnecte.email;

            profil.classList.add("d-none");
            editForm.classList.remove("d-none");
            message.classList.add("d-none");
        });

        // Annuler la modification
        cancelButton.addEventListener("click", () => {
            editForm.classList.add("d-none");
            profil.classList.remove("d-none");
            message.classList.add("d-none");
        });

        // Enregistrer les modifications
        editForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (!csrfToken) {
                afficherMessage(
                    "Jeton de sécurité indisponible.",
                    "danger"
                );
                return;
            }

            const nom =
                document.getElementById("editNom").value.trim();

            const prenom =
                document.getElementById("editPrenom").value.trim();

            const email =
                document.getElementById("editEmail").value.trim();

            const ancienEmail = utilisateurConnecte.email;

            saveButton.disabled = true;

            try {
                const response = await fetch("/api/auth/me", {
                    method: "PUT",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json",
                        [csrfHeader]: csrfToken
                    },
                    body: JSON.stringify({
                        nom: nom,
                        prenom: prenom,
                        email: email
                    })
                });

                if (response.redirected) {
                    window.location.replace("/login.html");
                    return;
                }

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message ||
                        "Erreur lors de la modification."
                    );
                }

                afficherProfil(data);

                // Si l'e-mail change, le backend ferme la session
                if (ancienEmail.toLowerCase() !==
                    data.email.toLowerCase()) {

                    alert(
                        "Votre adresse e-mail a changé. " +
                        "Veuillez vous reconnecter."
                    );

                    window.location.replace("/login.html");
                    return;
                }

                afficherMessage(
                    "Profil modifié avec succès !",
                    "success"
                );

            } catch (error) {
                afficherMessage(error.message, "danger");

            } finally {
                saveButton.disabled = false;
            }
        });

        // Déconnexion
        logoutButton.addEventListener("click", async () => {

            if (!csrfToken) {
                return;
            }

            logoutButton.disabled = true;

            try {
                const response = await fetch("/logout", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        [csrfHeader]: csrfToken
                    }
                });

                if (response.ok || response.redirected) {
                    window.location.replace(
                        "/login.html?logout"
                    );
                    return;
                }

                throw new Error("Échec de la déconnexion.");

            } catch (error) {
                afficherMessage(error.message, "danger");
                logoutButton.disabled = false;
            }
        });

        chargerProfil();
        chargerCsrf();
    </script>

</body>
</html>
