
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Inscription - FiniTask</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container min-vh-100 d-flex
                justify-content-center align-items-center">

        <div class="card shadow p-4"
             style="width: 100%; max-width: 450px;">

            <h2 class="text-center text-primary mb-2">
                FiniTask
            </h2>

            <p class="text-center text-muted mb-4">
                Créez votre compte
            </p>

            <!-- Messages -->
            <div id="message"
                 class="alert d-none"
                 role="alert"></div>

            <!-- Formulaire d'inscription -->
            <form id="registerForm">

                <div class="mb-3">
                    <label for="nom" class="form-label">
                        Nom
                    </label>
                    <input type="text"
                           id="nom"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label for="prenom" class="form-label">
                        Prénom
                    </label>
                    <input type="text"
                           id="prenom"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">
                        Adresse e-mail
                    </label>
                    <input type="email"
                           id="email"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label for="motDePasse" class="form-label">
                        Mot de passe
                    </label>
                    <input type="password"
                           id="motDePasse"
                           class="form-control"
                           minlength="8"
                           autocomplete="new-password"
                           required>
                </div>

                <div class="mb-3">
                    <label for="confirmation" class="form-label">
                        Confirmer le mot de passe
                    </label>
                    <input type="password"
                           id="confirmation"
                           class="form-control"
                           minlength="8"
                           autocomplete="new-password"
                           required>
                </div>

                <button type="submit"
                        id="registerButton"
                        class="btn btn-primary w-100"
                        disabled>
                    S'inscrire
                </button>

            </form>

            <p class="text-center mt-3 mb-0">
                Déjà un compte ?
                <a href="/login.html">Se connecter</a>
            </p>

        </div>
    </div>

    <script>
        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const button = document.getElementById("registerButton");

        let csrfToken = null;
        let csrfHeader = null;

        function afficherMessage(texte, type) {
            message.textContent = texte;
            message.className = "alert alert-" + type;
        }

        // Récupérer un jeton CSRF avant l'inscription
        async function chargerCsrf() {
            try {
                const response = await fetch("/api/csrf", {
                    credentials: "same-origin"
                });

                if (!response.ok) {
                    throw new Error("Impossible de charger le jeton CSRF");
                }

                const data = await response.json();

                csrfToken = data.token;
                csrfHeader = data.headerName;

                button.disabled = false;

            } catch (error) {
                afficherMessage(
                    "Impossible de préparer l'inscription. Rechargez la page.",
                    "danger"
                );
            }
        }

        // Envoyer le formulaire au backend
        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const nom = document.getElementById("nom").value.trim();
            const prenom = document.getElementById("prenom").value.trim();
            const email = document.getElementById("email").value.trim();
            const motDePasse =
                document.getElementById("motDePasse").value;

            const confirmation =
                document.getElementById("confirmation").value;

            if (motDePasse !== confirmation) {
                afficherMessage(
                    "Les mots de passe ne correspondent pas.",
                    "danger"
                );
                return;
            }

            if (!csrfToken) {
                afficherMessage(
                    "Jeton de sécurité indisponible.",
                    "danger"
                );
                return;
            }

            button.disabled = true;

            try {
                const response = await fetch("/api/auth/register", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json",
                        [csrfHeader]: csrfToken
                    },
                    body: JSON.stringify({
                        nom: nom,
                        prenom: prenom,
                        email: email,
                        motDePasse: motDePasse
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    afficherMessage(
                        "Compte créé avec succès ! Vous pouvez vous connecter.",
                        "success"
                    );

                    form.reset();

                } else {
                    afficherMessage(
                        data.message || "Erreur lors de l'inscription.",
                        "danger"
                    );
                }

            } catch (error) {
                afficherMessage(
                    "Impossible de contacter le serveur.",
                    "danger"
                );

            } finally {
                button.disabled = false;
            }
        });

        chargerCsrf();
    </script>

</body>
</html>
