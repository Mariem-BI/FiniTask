
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Connexion - FiniTask</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container min-vh-100 d-flex
                justify-content-center align-items-center">

        <div class="card shadow p-4"
             style="width: 100%; max-width: 420px;">

            <h2 class="text-center text-primary mb-2">
                FiniTask
            </h2>

            <p class="text-center text-muted mb-4">
                Connectez-vous à votre espace
            </p>

            <!-- Messages de connexion -->
            <div id="errorMessage"
                 class="alert alert-danger d-none">
                Adresse e-mail ou mot de passe incorrect.
            </div>

            <div id="logoutMessage"
                 class="alert alert-success d-none">
                Vous avez été déconnecté avec succès.
            </div>

            <!-- Formulaire de connexion -->
            <form action="/login" method="post" id="loginForm">

                <div class="mb-3">
                    <label for="email" class="form-label">
                        Adresse e-mail
                    </label>

                    <input type="email"
                           id="email"
                           name="username"
                           class="form-control"
                           placeholder="Votre adresse e-mail"
                           autocomplete="username"
                           required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">
                        Mot de passe
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           placeholder="Votre mot de passe"
                           autocomplete="current-password"
                           required>
                </div>

                <!-- Jeton CSRF -->
                <input type="hidden"
                       name="_csrf"
                       id="csrfToken">

                <button type="submit"
                        id="loginButton"
                        class="btn btn-primary w-100"
                        disabled>
                    Se connecter
                </button>

            </form>

            <p class="text-center mt-3 mb-0">
                Pas encore de compte ?
                <a href="/register.html">
                    S'inscrire
                </a>
            </p>

        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {

            // Afficher les messages selon l'URL
            const params = new URLSearchParams(window.location.search);

            if (params.has("error")) {
                document.getElementById("errorMessage")
                    .classList.remove("d-none");
            }

            if (params.has("logout")) {
                document.getElementById("logoutMessage")
                    .classList.remove("d-none");
            }

            // Récupérer le jeton CSRF
            try {
                const response = await fetch("/api/csrf", {
                    credentials: "same-origin"
                });

                if (!response.ok) {
                    throw new Error("Erreur lors de la récupération du CSRF");
                }

                const data = await response.json();

                document.getElementById("csrfToken").value = data.token;

                // Activer la connexion une fois le CSRF chargé
                document.getElementById("loginButton").disabled = false;

            } catch (error) {
                console.error(error);

                alert(
                    "Impossible de préparer la connexion. " +
                    "Veuillez recharger la page."
                );
            }
        });
    </script>

</body>
</html>
